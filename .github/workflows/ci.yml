name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Build never touches the database (all data pages are dynamic),
          # but Auth.js wants a secret at import time in production builds.
          AUTH_SECRET: ci-only-secret-not-used-at-runtime
