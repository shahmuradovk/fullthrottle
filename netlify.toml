# Netlify deploy configuration.
#
# 1. Netlify UI → Add new project → Import from GitHub → this repo.
# 2. Provision a database: site → Extensions → Neon (Netlify DB). It injects
#    NETLIFY_DATABASE_URL; the build maps it automatically, runs migrations,
#    and seeds the catalog on first deploy.
# 3. Set AUTH_SECRET (openssl rand -base64 32) plus ADMIN_EMAIL and
#    ADMIN_INITIAL_PASSWORD under Site configuration → Environment variables.
#    Payment/OAuth/email keys from .env.example activate their features when
#    added.

[build]
  command = "node scripts/netlify-build.mjs"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
