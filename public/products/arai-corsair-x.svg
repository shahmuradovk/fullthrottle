  <!-- rear diffuser -->
  <path d="M600 150 C640 180 660 230 662 280 L644 282 C640 236 622 196 588 168 Z" fill="#B9B6AC" stroke="#9BA3A8" stroke-width="4"/>
  <!-- crown vent -->
