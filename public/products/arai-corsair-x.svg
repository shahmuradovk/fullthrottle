<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Arai Corsair-X full-face helmet, white round shell">
  <defs>
    <linearGradient id="shell4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F0EA"/>
      <stop offset="0.6" stop-color="#DEDBD2"/>
      <stop offset="1" stop-color="#B9B6AC"/>
    </linearGradient>
    <linearGradient id="visor4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FA3DC" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#1C2228" stop-opacity="0.9"/>
