    </linearGradient>
  </defs>
  <!-- round R75 shell -->
  <path d="M255 190 C305 112 420 88 505 112 C598 140 652 215 656 298 C660 370 636 438 582 468 L572 470 C568 444 558 430 538 428 L305 428 C266 428 240 402 230 358 C220 304 226 232 255 190 Z"
