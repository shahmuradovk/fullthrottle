<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="HJC RPHA 12 Carbon full-face helmet with visible carbon weave">
  <defs>
    <pattern id="weave" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="#1B2026"/>
      <rect width="13" height="13" fill="#242B33"/>
      <rect x="13" y="13" width="13" height="13" fill="#242B33"/>
    </pattern>
    <linearGradient id="sheen3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8E6E0" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#E8E6E0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="visor3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFA23C" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#1C2228" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#101316"/>
    </linearGradient>
  </defs>
  <!-- carbon shell -->
  <path d="M248 182 C300 110 415 88 500 110 C595 136 650 210 656 295 C661 368 638 438 585 468 L575 470 C571 444 560 430 540 428 L302 428 C262 428 236 400 226 356 C215 300 219 228 248 182 Z"
        fill="url(#weave)" stroke="#3A4148" stroke-width="6"/>
  <!-- carbon sheen -->
  <path d="M248 182 C300 110 415 88 500 110 C560 126 606 162 632 210 L280 240 C255 220 244 200 248 182 Z"
        fill="url(#sheen3)"/>
  <!-- visor -->
  <path d="M256 210 C310 168 398 154 468 170 C518 182 550 210 558 247 C564 277 550 302 518 308 L340 308 C300 308 268 282 256 247 Z"
        fill="url(#visor3)" stroke="#101316" stroke-width="6"/>
  <!-- tool-less shield pivot -->
  <circle cx="558" cy="292" r="26" fill="#23282F" stroke="#3A4148" stroke-width="5"/>
  <circle cx="558" cy="292" r="10" fill="#E8622C"/>
  <!-- chin bar -->
  <path d="M226 356 C232 402 264 428 304 428 L410 428 C400 390 370 360 330 348 L240 330 C230 336 224 346 226 356 Z"
        fill="url(#weave)" stroke="#3A4148" stroke-width="5"/>
  <rect x="268" y="366" width="56" height="18" rx="6" fill="#101316" stroke="#3A4148" stroke-width="3"/>
  <!-- emergency cheek pad pull tab -->
  <path d="M330 430 L360 430 L356 458 L334 458 Z" fill="#E8622C"/>
  <!-- crown vent -->
  <path d="M352 108 L396 98 L403 116 L360 126 Z" fill="#101316" stroke="#3A4148" stroke-width="3"/>
  <!-- base gasket -->
  <path d="M302 430 L540 430 C558 430 570 444 574 470 L560 476 C520 452 342 452 304 476 L290 468 C290 448 294 434 302 430 Z" fill="#101316"/>
</svg>
