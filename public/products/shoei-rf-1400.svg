  </defs>
  <!-- narrower aero shell with rear spoiler -->
  <path d="M250 190 C295 115 405 88 490 105 C585 125 645 200 652 285 C658 350 645 415 600 450 C620 430 655 428 672 438 L676 452 C640 452 610 462 585 478 L575 478 C572 452 560 436 540 434 L305 434 C265 434 238 405 228 360 C217 305 222 235 250 190 Z"
