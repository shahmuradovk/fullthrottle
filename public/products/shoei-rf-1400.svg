    <linearGradient id="visor2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8E6E0" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#1C2228" stop-opacity="0.92"/>
